<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crucible Quick Reference</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="quickref.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d0b0a;
            overflow: hidden;
        }
        /* L'application prend désormais tout l'écran sur le site web */
        #app-viewport {
            width: 100%;
            height: 100%;
            position: relative;
        }
    </style>
</head>
<body>

    <div id="app-viewport"></div>

    <script type="module">
        import { QuickRefCore } from './quickref-core.js';

        async function start() {
            const app = new QuickRefCore({
                container: document.getElementById('app-viewport'),
                basePath: './data'
            });
            await app.loadData();
            app.render();
        }
        window.addEventListener('DOMContentLoaded', start);
    </script>
</body>
</html>

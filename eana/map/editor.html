<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<!-- Voir map/index.html : le code partagé écrit ses chemins comme si la page
     était à la racine du site. -->
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Éditeur de carte — Eana</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="map/map.css">
<link rel="stylesheet" href="map/editor.css">
<script>
  try {
    if (localStorage.getItem("eana_theme") === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  } catch (e) {}
</script>
</head>
<body class="map-page editor-page">

<div class="app-shell map-shell editor-shell">
  <header class="editor-header">
    <a class="corner-link map-back" href="map/">Voir la carte</a>
    <a class="corner-link editor-tiles-link" href="map/tiles.html">Découper en tuiles →</a>
    <h1 class="editor-title">Éditeur de repères</h1>
    <div class="editor-status">
      <span id="save-state" class="save-state">Chargement…</span>
      <button type="button" id="save-btn" class="editor-btn editor-btn-primary" disabled>Enregistrer</button>
      <button type="button" id="download-btn" class="editor-btn" title="Télécharger le JSON (secours si l'enregistrement direct est indisponible)">Télécharger</button>
    </div>
  </header>

  <div class="editor-body">
    <aside class="editor-panel">
      <section class="editor-section" id="map-picker-section" hidden>
        <h2>Carte</h2>
        <p class="editor-hint">Chaque repère appartient à une carte. Les autres restent enregistrés.</p>
        <div class="type-palette" id="map-picker"></div>
      </section>

      <section class="editor-section">
        <h2>Type de repère</h2>
        <p class="editor-hint">Choisis un type, puis clique sur la carte pour poser un repère.</p>
        <div class="type-palette" id="type-palette"></div>
      </section>

      <section class="editor-section editor-section-grow">
        <h2>Repères <span class="editor-count" id="point-count">0</span></h2>
        <input type="search" id="point-filter" class="editor-input" placeholder="Filtrer la liste…" autocomplete="off">
        <ul class="point-list" id="point-list"></ul>
      </section>
    </aside>

    <div class="map-frame editor-map-frame">
      <div class="map-viewport" id="map-viewport">
        <div class="map-canvas" id="map-canvas">
          <!-- Rempli par js/mapbackground.js, comme sur la carte publique. -->
          <div class="map-bg" id="map-bg"></div>
          <div id="map-pins"></div>
        </div>
      </div>

      <div class="map-zoom-controls">
        <button type="button" id="zoom-in" aria-label="Zoom avant">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button type="button" id="zoom-out" aria-label="Zoom arrière">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg>
        </button>
        <button type="button" id="zoom-reset" aria-label="Recentrer la carte">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 15v5h-5M4 15v5h5M20 9V4h-5"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Fenêtre d'édition d'un repère -->
<div class="gate" id="point-dialog" hidden>
  <div class="gate-backdrop" data-dialog-close></div>
  <div class="gate-box editor-dialog">
    <h5 id="dialog-title">Nouveau repère</h5>

    <label class="editor-label" for="dialog-type">Type</label>
    <select class="editor-input" id="dialog-type"></select>

    <label class="editor-label" for="dialog-article">Fiche liée</label>
    <div class="article-picker">
      <input type="search" class="editor-input" id="dialog-article" placeholder="Chercher une fiche…" autocomplete="off">
      <ul class="article-results" id="article-results" hidden></ul>
    </div>
    <p class="article-chosen" id="article-chosen">Aucune fiche liée</p>

    <label class="editor-label" for="dialog-label">Nom affiché <span class="editor-optional">(optionnel — sinon le titre de la fiche)</span></label>
    <input type="text" class="editor-input" id="dialog-label" autocomplete="off">

    <p class="editor-coords" id="dialog-coords"></p>

    <div class="gate-actions">
      <button type="button" data-dialog-close>Annuler</button>
      <button type="button" class="editor-btn-danger" id="dialog-delete">Supprimer</button>
      <button type="button" class="gate-ok" id="dialog-ok">Valider</button>
    </div>
  </div>
</div>

<button id="theme-toggle" class="theme-toggle" type="button" title="Mode sombre" aria-label="Basculer entre mode clair et sombre">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>
  </svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4.2"/>
    <path d="M12 2.5v2.6M12 18.9v2.6M4.2 4.2l1.9 1.9M17.9 17.9l1.9 1.9M2.5 12h2.6M18.9 12h2.6M4.2 19.8l1.9-1.9M17.9 6.1l1.9-1.9"/>
  </svg>
</button>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/theme.js"></script>
<script src="js/mapview.js"></script>
<script src="js/mapbackground.js"></script>
<script src="js/mappoints.js"></script>
<script src="map/editor.js"></script>
</body>
</html>

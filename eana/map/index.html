<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<!-- Le HTML/JS partagé (data.js, render.js…) écrit ses chemins d'image et
     de données comme si la page vivait à la racine du site (ex.
     "data/categories.json", "images/banners/x.png") — c'est le cas pour
     index.html, pas pour celle-ci, un niveau plus bas. "base" corrige ça
     pour TOUTE URL relative de la page, y compris celles injectées plus
     tard en HTML (fiche, bannière…) : plus simple et plus sûr que de faire
     porter un préfixe "../" à travers tout le code partagé. En clair :
     tout ce qui suit dans ce fichier s'écrit comme si on était à la racine
     du site (eana/), pas dans eana/map/. -->
<base href="../">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte — Codex d'Eana</title>
<meta name="description" content="Carte interactive de l'univers d'Eana.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="map/map.css">
<script>
  // Voir index.html à la racine : même principe, pour éviter le flash.
  try {
    if (localStorage.getItem("eana_theme") === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  } catch (e) { /* stockage indisponible : on reste en clair */ }
</script>
</head>
<body class="map-page">

<div class="app-shell map-shell">
  <header class="site-header map-header">
    <!-- Même rosace que l'accueil : le style et l'animation viennent de
         css/style.css (.compass), l'en-tête portant déjà "site-header". -->
    <svg class="compass" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
      <circle cx="50" cy="50" r="46"/>
      <circle cx="50" cy="50" r="36"/>
      <circle cx="50" cy="50" r="8"/>
      <path d="M50 4v92M4 50h92" stroke-width=".6"/>
      <path class="needle" d="M50 8l7 34 34 8-34 8-7 34-7-34-34-8 34-8z" stroke-width="1.2"/>
      <path d="M22 22l17 39 39 17-17-39z" stroke-width=".5"/>
    </svg>
    <a class="corner-link map-back" href="index.html" data-i18n="map.backToCodex">Retour au codex</a>
    <p class="site-eyebrow" data-i18n="map.eyebrow">Repères du monde connu</p>
    <a class="site-title" href="index.html#/" data-i18n="site.title">Codex d'Eana</a>
    <p class="site-subtitle" data-i18n="map.subtitle">Clique un repère pour ouvrir sa fiche.</p>
    <div class="header-rule"></div>
  </header>

  <div class="map-tools">
    <button class="chip active" data-mode="public">Public</button>
    <button class="chip" data-mode="master">Maître</button>
  </div>

  <div class="map-frame">
    <div class="map-viewport" id="map-viewport">
      <div class="map-canvas" id="map-canvas">
        <!-- src posé par le JS depuis data/map-config.json -->
        <img class="map-image" alt="" id="map-image">
        <div id="map-pins"></div>
      </div>
    </div>

    <div class="map-zoom-controls">
      <button type="button" id="zoom-in" data-i18n-attr="aria-label:map.zoomIn" aria-label="Zoom avant">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button type="button" id="zoom-out" data-i18n-attr="aria-label:map.zoomOut" aria-label="Zoom arrière">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <button type="button" id="zoom-reset" data-i18n-attr="aria-label:map.resetView" aria-label="Recentrer la carte">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 15v5h-5M4 15v5h5M20 9V4h-5"/></svg>
      </button>
    </div>
  </div>
</div>

<div id="overlay-root"></div>
<div id="master-root"></div>
<div id="gate-root"></div>

<button id="theme-toggle" class="theme-toggle" type="button" data-i18n-attr="aria-label:theme.toggleAriaLabel;title:theme.toDark">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>
  </svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4.2"/>
    <path d="M12 2.5v2.6M12 18.9v2.6M4.2 4.2l1.9 1.9M17.9 17.9l1.9 1.9M2.5 12h2.6M18.9 12h2.6M4.2 19.8l1.9-1.9M17.9 6.1l1.9-1.9"/>
  </svg>
</button>

<div class="key-hints" aria-hidden="true">
  <span class="key-hint"><kbd data-i18n="keyHints.escKey">Échap</kbd><span data-i18n="keyHints.close">Fermer</span></span>
</div>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/theme.js"></script>
<script src="js/master.js"></script>
<script src="js/overlay.js"></script>
<script src="js/mapview.js"></script>
<script src="js/mappoints.js"></script>
<script src="map/map.js"></script>
</body>
</html>

<!-- Carte de repli, en attendant la vraie carte de Valisthéa. Volontairement dans
     les tons parchemin fixes (pas de variables CSS de thème) : une carte
     dessinée dans l'univers ne change pas d'aspect selon le thème du
     lecteur, comme la bannière de blason. Coordonnées de points de repère à
     exprimer en % de 2000x1400 (le viewBox ci-dessous), pour rester
     valables quelle que soit la résolution de la vraie carte tant que le
     ratio est proche. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1400" width="2000" height="1400">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#f3ecdc"/>
      <stop offset="70%" stop-color="#ece3d0"/>
      <stop offset="100%" stop-color="#d9cba8"/>
    </radialGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#2f5259" stroke-width="1" opacity=".055"/>
    </pattern>
  </defs>

  <rect width="2000" height="1400" fill="url(#vignette)"/>
  <rect width="2000" height="1400" fill="url(#grid)"/>

  <!-- côtes et reliefs abstraits, purement décoratifs -->
  <g fill="none" stroke="#2f5259" stroke-width="2.5" opacity=".22" stroke-linecap="round">
    <path d="M0 980c180-90 260 40 420-10s300-140 480-90 260 120 420 60 320-150 480-70 140 90 200 70"/>
    <path d="M0 1040c200-70 300 60 460 10s280-120 440-60 260 110 420 50 300-130 480-60"/>
    <path d="M120 300c60-60 140-70 190-30M1550 220c70-40 150-30 200 20M1700 900c50-70 130-90 190-50"/>
    <path d="M300 420l40-70 40 70zM1450 500l50-85 50 85zM980 250l35-60 35 60z"/>
  </g>
  <g fill="none" stroke="#a03a2b" stroke-width="1.6" opacity=".16" stroke-dasharray="2 14" stroke-linecap="round">
    <path d="M180 250c260 120 420-40 640 60s380 160 620 60 420-180 560-40"/>
  </g>

  <!-- cadre à double liseré -->
  <rect x="26" y="26" width="1948" height="1348" fill="none" stroke="#2f5259" stroke-width="4" opacity=".5"/>
  <rect x="42" y="42" width="1916" height="1316" fill="none" stroke="#2f5259" stroke-width="1.5" opacity=".35"/>

  <!-- rose des vents -->
  <g transform="translate(1730,230)" fill="none" stroke="#2f5259" opacity=".45">
    <circle r="130" stroke-width="1.5"/>
    <circle r="100" stroke-width="1"/>
    <path d="M0 -130V130M-130 0H130" stroke-width="1"/>
    <path d="M0 -100l22 78-22 78-22-78z" stroke-width="2.2"/>
    <path d="M-100 0l78 22-78 22-78-22z" stroke-width="2.2" transform="rotate(90)"/>
  </g>

  <!-- filigrane : la carte n'est pas encore dessinée -->
  <g transform="translate(1000,760)" text-anchor="middle" fill="#2f5259" opacity=".28" font-family="Georgia, serif">
    <text y="-10" font-size="200" font-weight="700">?</text>
    <text y="90" font-size="34" letter-spacing="8">CARTE EN PRÉPARATION</text>
  </g>
</svg>
